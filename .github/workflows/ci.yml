name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Tests run on `node --test` and need Node >= 21 (Object.groupBy).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Fails on any formatting diff or any lint error, warning or info.
      - run: bun run check:strict
      - run: bun run test
      - run: bun run build
